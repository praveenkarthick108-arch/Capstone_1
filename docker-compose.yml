version: '3.9'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./backend/chroma_db:/app/chroma_db
      - ./backend/bm25_index.pkl:/app/bm25_index.pkl
    env_file:
      - ./backend/.env
    environment:
      - CHROMA_PERSIST_DIR=/app/chroma_db
      - BM25_INDEX_PATH=/app/bm25_index.pkl
      - DATA_CSV_PATH=/app/data/telecom_incidents.csv
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    driver: bridge
